version: 2

project_name: cid

builds:
  - id: cid
    main: ./cmd/cid
    binary: cid
    env:
      - CGO_ENABLED=0
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/nicoarbelaez/claude-identity/internal/version.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# The GitHub Release (and its notes) is created by release-please before this
# runs. GoReleaser only attaches assets and must not overwrite the notes.
release:
  mode: keep-existing

changelog:
  disable: true
